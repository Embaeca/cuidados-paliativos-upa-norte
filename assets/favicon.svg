<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo Sálvia Sereno -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#769481"/>
      <stop offset="100%" stop-color="#526C5C"/>
    </linearGradient>

    <!-- Gradiente do Coração Acolhedor -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F5F2"/>
    </linearGradient>

    <!-- Gradiente Terracota Acolhedor da Folha/Broto -->
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D98A72"/>
      <stop offset="100%" stop-color="#B8715A"/>
    </linearGradient>

    <!-- Sombra Suave e Confortável -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1F2821" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Base com Cantos Arredondados Suaves (Squircle Moderno) -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)"/>

  <!-- Anel Interno Delicado de Contraste -->
  <rect x="40" y="40" width="432" height="432" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="5"/>

  <!-- Grupo Principal do Ícone: Coração de Cuidado e Folha da Vida -->
  <g filter="url(#softShadow)">
    <!-- Halo Suave de Luz -->
    <circle cx="256" cy="256" r="148" fill="rgba(255, 255, 255, 0.08)"/>

    <!-- Coração Humano e Compassivo -->
    <path d="M256 405 C240 388 120 286 120 198 C120 134 168 96 222 108 C238 112 249 122 256 134 C263 122 274 112 290 108 C344 96 392 134 392 198 C392 286 272 388 256 405 Z" 
          fill="url(#heartGrad)"/>

    <!-- Folha / Broto de Conforto em Terracota Suave no Centro do Coração -->
    <path d="M256 168 C262 216 296 256 314 284 C322 297 311 316 288 312 C255 306 238 270 240 234 C242 206 252 178 256 168 Z" 
          fill="url(#terracottaGrad)"/>

    <path d="M256 168 C250 216 220 252 204 278 C196 291 207 310 228 306 C252 301 264 275 264 246 C264 218 258 184 256 168 Z" 
          fill="#C17C64" 
          opacity="0.55"/>

    <!-- Ponto Central Sutil de Luz e Serenidade -->
    <circle cx="256" cy="158" r="8" fill="rgba(255, 255, 255, 0.85)"/>
  </g>
</svg>
